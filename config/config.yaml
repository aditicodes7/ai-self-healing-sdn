# ai-self-healing-sdn master configuration.
# Every runtime tunable lives here. Nothing is hardcoded in modules.
# See docs/architecture.md for the meaning of each derived feature/formula
# and docs/decisions.md for why specific defaults were chosen.

project:
  name: ai-self-healing-sdn
  # Set by the Phase 2 GO/NO-GO smoke test (2026-08-31): ryu==4.34 imports
  # and a real Mininet pingall passed 0% dropped, so no os-ken fallback
  # was needed. See PROJECT_STATE.md and docs/decisions.md.
  controller_backend: ryu

controller:
  openflow_version: "1.3"
  observe_links: true
  of_listen_host: "0.0.0.0"
  of_listen_port: 6653

network:
  # Which network/topologies/<name>.yaml the live controller assumes.
  # Needed for link capacity_bps (utilization = throughput / capacity),
  # since the controller has no other way to learn a link's configured
  # bandwidth -- OpenFlow doesn't report it, and it's not something LLDP
  # discovery carries. Must match whatever topo_builder.py actually built.
  topology_name: scenario_a

telemetry:
  interval_s: 2
  probe_timeout_s: 1.0
  # OFPEchoRequest RTT is halved to estimate one-way latency; see
  # docs/architecture.md#latency-estimate for the full derivation and the
  # Phase 5 validation against independent ping ground truth.
  echo_interval_s: 2

features:
  windows: [3, 5, 10]
  ewma_alpha: 0.2
  baseline_healthy_windows: 20
  # Explicit NaN policy (never silent fillna(0)): if fewer than `windows`
  # samples exist yet, rolling stats for that window are emitted as null and
  # the consumer (ML pipeline) must treat null as "insufficient history",
  # not zero.
  min_history_for_window: true

label:
  horizon_s: 10

ml:
  # Chosen from a threshold sweep on the HELD-OUT test set (seeds 7,8 --
  # never used in training), recorded in
  # results/tables/ml_threshold_sweep.json. F1 peaks here (0.416 at
  # precision 0.558 / recall 0.331) versus 0.355 at the previous 0.75,
  # which had been picked a priori in Phase 1 before any model existed.
  #
  # Trading per-reading precision for recall is the right direction for
  # THIS architecture: a missed degradation is unrecoverable, while a
  # false positive is filtered twice more downstream -- by persistence
  # (3-of-4 windows) and then by stability (cooldown / route-hold /
  # min-improvement). Per-reading precision is therefore not the rate at
  # which spurious reroutes actually happen.
  threshold: 0.40
  model_path: models/degradation_model.joblib
  metadata_path: models/metadata.json
  candidate_models:
    - histgradientboosting
    - randomforest
    - logisticregression_baseline
  # inference_client.py's HTTP call budget to ml_rl_service.py. Exceeding
  # this (or any connection failure) triggers the safety-gate fallback:
  # no prediction is fabricated, the miss is logged, and callers must
  # treat "no recent prediction" as inconclusive, never as "healthy".
  inference_timeout_ms: 300

ml_rl_service:
  host: "127.0.0.1"
  port: 8100

persistence:
  window: 4
  consecutive: 3
  # Sits immediately BELOW ml.threshold so the decision rule is monotonic:
  # p < 0.25 healthy, 0.25 < p < 0.40 abstain, p >= 0.40 degraded. The
  # previous [0.45, 0.60] band sat above a 0.75 threshold, which made the
  # rule non-monotonic once the threshold moved (a 0.42 reading would
  # have counted as degraded while a 0.50 reading abstained).
  uncertainty_band: [0.25, 0.40]

stability:
  cooldown_s: 30
  route_hold_s: 60
  min_improvement: 0.15

path:
  k_shortest: 4
  weights:
    utilization: 1.0
    latency: 1.0
    loss: 2.0
    hop_count: 0.25

experiment:
  # Which system-under-test this controller instance runs as (Phase 22):
  # B1_SHORTEST_PATH | B2_RULE_BASED | P1_ML_HEURISTIC | P2_ML_RL.
  # The experiment harness generates a per-trial config and points the
  # controller at it via AI_SDN_CONFIG, so the tracked default here is
  # simply the full system.
  system: P2_ML_RL

baselines:
  # B2 (rule-based reactive, controller/baselines/rule_based.py): reroute
  # if a link's CURRENT (not predicted, not persisted) utilization/loss
  # exceeds these fixed thresholds. Deliberately separate from
  # ml.threshold/persistence.* -- B2 exists precisely to isolate simple
  # reactive thresholding from prediction+persistence in the Phase 22
  # comparison study.
  b2_utilization_threshold: 0.80
  b2_loss_threshold: 0.10

rl:
  algorithm: MaskablePPO
  timeout_ms: 200
  train_steps: 300000
  eval_episodes: 50
  policy_path: models/routing_policy.zip
  reward_weights:
    w1_throughput: 1.0
    w2_latency: 1.0
    w3_loss: 1.0
    w4_recovery_success: 2.0
    w5_max_utilization_after: 1.0
    w6_reroute_cost: 0.5
    w7_oscillation_penalty: 1.5
    w8_failed_remediation: 2.0

flow:
  priority_remediated: 200
  priority_default: 100
  hard_timeout_s: 300
  idle_timeout_s: 0

verify:
  settle_s: 8
  windows: 3
  tolerance:
    latency_pct: 0.20
    loss_pct: 0.20

remediation:
  max_retries: 2

traffic:
  iperf3_port: 5201
  iperf3_protocol: tcp

database:
  path: database/network.db
  wal: true
  retention_days: 30

api:
  host: "0.0.0.0"
  port: 8000

seeds:
  global: 42
  dataset_runs: [1, 2, 3, 4, 5, 6, 7, 8]
  rl_train: 42
  eval: 100
